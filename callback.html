<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>MuseDrive 授权回调</title></head>
<body style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px">
<h2>授权已返回</h2>
<p>请把下面这一整行地址完整复制，发回给小满（里面的一次性授权码几分钟内有效、只能用一次）：</p>
<p id="u" style="word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px"></p>
<button onclick="navigator.clipboard.writeText(location.href)" style="padding:10px 20px;font-size:16px">复制完整地址</button>
<script>document.getElementById('u').textContent = location.href;</script>
</body>
</html>
